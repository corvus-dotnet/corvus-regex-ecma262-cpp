# Build, the tests (over the C library's shared and static libraries), the README's example, and a consumer project
# built against the installed package, on Linux (glibc and musl, x64 and arm64, GCC and Clang), macOS and Windows; and
# the ECMA-262 test data through this header on Linux and Windows (and on Linux, as the data's own scripts write it for
# Unicode 13 and 18 and for the grammar of ECMAScript 2020). Each build downloads the C library's release archive
# for its platform, as a user's build does. The data is pinned to a commit; the pass is 0 wrong answers, 0 refusals of
# a valid pattern, 0 acceptances of an invalid one and 0 matches at their limit, over UTF-8 and UTF-16.
name: ci
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: linux-x64-gcc
          os: ubuntu-24.04
          cc: gcc
          cxx: g++
        - name: linux-x64-clang
          os: ubuntu-24.04
          cc: clang
          cxx: clang++
        - name: linux-arm64-gcc
          os: ubuntu-24.04-arm
          cc: gcc
          cxx: g++
        - name: macos-arm64
          os: macos-latest
        - name: windows-x64-msvc
          os: windows-latest
        - name: windows-arm64-msvc
          os: windows-11-arm
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Check that docs/api.md is what the header makes
      if: matrix.name == 'linux-x64-gcc'
      shell: pwsh
      run: ./tools/docs/gen-api.ps1 -Check
    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build build --config Release -j 4
    - name: Test
      run: ctest --test-dir build -C Release --output-on-failure
    - name: Install
      run: cmake --install build --config Release --prefix "${{ runner.temp }}/prefix"
    - name: Build and run a consumer of the installed package
      shell: bash
      run: |
        cmake -S tests/consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.temp }}/prefix"
        cmake --build build-consumer --config Release
        if [ -f build-consumer/Release/consumer.exe ]; then program=build-consumer/Release/consumer.exe; else program=build-consumer/consumer; fi
        "$program" > out.txt
        diff --strip-trailing-cr examples/expected.txt out.txt

  dataset:
    name: The ECMA-262 test data (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: corvus-dotnet/ecma262-regex-test-data
        ref: 1b4c4353c4fa3fc3e318db32ef0261391519b9a5
        path: ecma262-regex-test-data
        persist-credentials: false
    - name: The checked-in counts were made at this commit of the test data
      # The compliance of an engine too slow to judge every night is checked in beside the harness, with the commit of
      # the data it was made at (dataCommit); the benchmark page judges it against that commit. Moving the pin above
      # means working them out again (README.md), so they cannot fall behind it unnoticed.
      if: runner.os == 'Linux'
      shell: bash
      run: |
        pin=$(git -C ecma262-regex-test-data rev-parse HEAD)
        fail=0
        for f in $(git ls-files | grep -E '(^|/)compliance-[^/]*\.json$'); do
          made=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("dataCommit", "none"))' "$f")
          if [ "$made" != "$pin" ]; then
            echo "::error file=$f::$f was made at $made, not the data CI checks out ($pin): work its counts out again at that commit."
            fail=1
          fi
        done
        exit $fail
    - name: Build the data-set runner
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCRE_CPP_TOOLS=ON -DCORVUS_REGEX_ECMA262_CPP_TESTS=OFF
        cmake --build build --config Release --target dataset -j 4
    - name: Run the ECMA-262 test data
      shell: bash
      run: |
        if [ -f build/tools/Release/dataset.exe ]; then runner=build/tools/Release/dataset.exe; else runner=build/tools/dataset; fi
        "$runner" ecma262-regex-test-data/data wrong-cases.tsv
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: runner.os == 'Linux'
      with:
        node-version: '24.22.1'
    - name: Run the ECMA-262 test data for other versions of Unicode and for ECMAScript 2020
      # The data as its own scripts write it for Unicode 13 and 18 (unicode.js apply) and for the grammar of
      # ECMAScript 2020 (edition.js apply), each judged through this header set to match.
      if: runner.os == 'Linux'
      shell: bash
      run: |
        data=ecma262-regex-test-data
        failed=()
        run() {
          name=$1; shift
          out="$RUNNER_TEMP/$name"
          case "$1" in
            unicode.js) node "$data/unicode.js" apply "$2" "$out" "$data/data" ;;
            edition.js) node "$data/edition.js" apply "$out" "$2" "$data/data" ;;
          esac
          shift 2
          build/tools/dataset "$out" "wrong-cases-$name.tsv" "$@" || failed+=("$name")
        }
        run unicode-13 unicode.js 13.0 --unicode 13
        run unicode-18 unicode.js 18.0 --unicode 18
        # An empty version is the data's own Unicode.
        run es2020 edition.js "" --edition es2020
        run es2020-unicode-13 edition.js 13.0 --edition es2020 --unicode 13
        if [ ${#failed[@]} -gt 0 ]; then echo "::error::Wrong: ${failed[*]}"; exit 1; fi
    - name: Keep the wrong cases
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wrong-cases-${{ matrix.os }}
        path: wrong-cases*.tsv

  packages:
    name: The vcpkg port and the Conan recipe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: The vcpkg port (from this checkout) and a consumer built with it
      shell: bash
      env:
        VCPKG_KEEP_ENV_VARS: CORVUS_REGEX_ECMA262_CPP_SOURCE
      run: |
        # A Windows path on Windows (Git Bash's own form is /d/a/...).
        if command -v cygpath >/dev/null; then export CORVUS_REGEX_ECMA262_CPP_SOURCE="$(cygpath -m "$PWD")"; else export CORVUS_REGEX_ECMA262_CPP_SOURCE="$PWD"; fi
        vcpkg="${VCPKG_INSTALLATION_ROOT}/vcpkg"
        "$vcpkg" install corvus-regex-ecma262-cpp --overlay-ports="$PWD/ports"
        cmake -S tests/consumer -B build-vcpkg -DCMAKE_BUILD_TYPE=Release           -DCMAKE_TOOLCHAIN_FILE="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"
        cmake --build build-vcpkg --config Release
        if [ -f build-vcpkg/Release/consumer.exe ]; then program=build-vcpkg/Release/consumer.exe; else program=build-vcpkg/consumer; fi
        "$program" > out.txt
        diff --strip-trailing-cr examples/expected.txt out.txt
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - name: The Conan recipe, static and shared
      shell: bash
      run: |
        pip install "conan>=2.10,<3"
        conan profile detect
        conan create . --build=missing -s compiler.cppstd=20
        conan create . --build=missing -s compiler.cppstd=20 -o "&:shared=True"

  musl:
    name: Build and test (linux-x64-musl)
    runs-on: ubuntu-24.04
    container: alpine:3.22
    steps:
    - name: Tools
      run: apk add --no-cache g++ cmake make git
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Configure, build and test
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j 4
        ctest --test-dir build --output-on-failure

  gate:
    # The one check of this workflow that the ruleset of main requires: it passes when every job above passed (or was
    # skipped), so a job added here is required with no change to the ruleset.
    name: CI gate
    if: always()
    needs: [build, dataset, packages, musl]
    runs-on: ubuntu-latest
    steps:
    - name: Every job passed
      env:
        RESULTS: ${{ toJSON(needs.*.result) }}
      run: |
        echo "$RESULTS"
        if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi

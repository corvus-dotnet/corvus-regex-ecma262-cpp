# Build, the tests (over the C library's shared and static libraries), the README's example, and a consumer project
# built against the installed package, on Linux (glibc and musl, x64 and arm64, GCC and Clang), macOS and Windows.
# Each build downloads the C library's release archive for its platform, as a user's build does.
name: ci
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: linux-x64-gcc
          os: ubuntu-24.04
          cc: gcc
          cxx: g++
        - name: linux-x64-clang
          os: ubuntu-24.04
          cc: clang
          cxx: clang++
        - name: linux-arm64-gcc
          os: ubuntu-24.04-arm
          cc: gcc
          cxx: g++
        - name: macos-arm64
          os: macos-latest
        - name: windows-x64-msvc
          os: windows-latest
        - name: windows-arm64-msvc
          os: windows-11-arm
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build build --config Release -j 4
    - name: Test
      run: ctest --test-dir build -C Release --output-on-failure
    - name: Install
      run: cmake --install build --config Release --prefix "${{ runner.temp }}/prefix"
    - name: Build and run a consumer of the installed package
      shell: bash
      run: |
        cmake -S tests/consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.temp }}/prefix"
        cmake --build build-consumer --config Release
        if [ -f build-consumer/Release/consumer.exe ]; then program=build-consumer/Release/consumer.exe; else program=build-consumer/consumer; fi
        "$program" > out.txt
        diff --strip-trailing-cr examples/expected.txt out.txt

  musl:
    name: Build and test (linux-x64-musl)
    runs-on: ubuntu-24.04
    container: alpine:3.22
    steps:
    - name: Tools
      run: apk add --no-cache g++ cmake make git
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Configure, build and test
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j 4
        ctest --test-dir build --output-on-failure
